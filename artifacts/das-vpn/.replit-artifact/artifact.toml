kind = "mobile"
previewPath = "/"
title = "DAS VPN"
description = "A premium mobile VPN app for DAS customers to buy M-Pesa subscriptions, securely manage anonymous device sessions, and connect to verified WireGuard VPN servers without creating an account."
version = "1.0.0"
id = "artifacts/das-vpn"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24319

[services.development]
run = "pnpm --filter @workspace/das-vpn run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/das-vpn", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/das-vpn", "run", "serve" ]

[services.env]
PORT = "24319"
BASE_PATH = "/"
